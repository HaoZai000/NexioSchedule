name: CI

# 门禁全部来自 docs/NAVIGATION_MIGRATION_HANDOFF.md 的「2. 门禁（每次改完必跑）」，
# 这里只是把它自动化：
#   1. checkKmpPurity                    已知 JVM 专有 API 静态扫描
#   2. :core:check :miuix:check :backdrop:check   默认态红线
#   3. :core:jvmTest --rerun-tasks       单测（不许吃缓存）
#   4. :androidApp:assembleDebug         Android 零回归
#
# 不覆盖的：iOS 需要 macOS + Xcode（且项目默认关着 iOS target，-Pnexio.ios=true 才开）；
# 鸿蒙需要 DevEco Studio 与 HarmonyOS SDK。这两个继续留在本地门禁。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties 要求 toolchainVersion=25。
      # 只装 17/21 会让 Gradle 卡在 toolchain 解析（本地实测卡过 20 分钟无输出），
      # 不是报错而是静默挂起，很难从日志看出来。
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk = 37 / targetSdk = 37（androidApp/build.gradle.kts）。
      # ubuntu runner 预装的 platform 版本不一定够新，这里显式装一次。
      - name: Install SDK platform for compileSdk 37
        run: |
          yes | sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # commonMain 必须保持平台中立（禁止 JVM 专有 API 漏进来）
      - name: KMP purity
        run: ./gradlew checkKmpPurity

      - name: Core gate (:core :miuix :backdrop check)
        run: ./gradlew :core:check :miuix:check :backdrop:check

      - name: Core JVM tests
        run: ./gradlew :core:jvmTest --rerun-tasks

      - name: Android assemble (debug)
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
