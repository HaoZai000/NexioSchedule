# Nexio课程表 - Gradle 全局构建参数
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true

# ── Kotlin/JS & Kotlin/Wasm（wasmJs 编译门禁用）─────────────────────────────
# 用**本机已装的 Node**（PATH 中 v24.16.0），不从 nodejs.org 下载发行版。
# 官方做法见 kotlinlang.org/docs/js-project-setup.html#use-pre-installed-node-js。
# EnvSpec.download=false 在根 build.gradle.kts 里配置（惰性，需 plugins.withType）。
# 注意：即使关了下载，Kotlin/Wasm 插件仍会在配置阶段注册 Distributions 仓库，
# 与 settings.gradle.kts 的 FAIL_ON_PROJECT_REPOS 冲突 —— 所以 wasmJs 门禁
# 走独立任务 `./gradlew checkKmpWasmJs`，不挂 check，离线 Android 门禁不受影响。
kotlin.js.yarn=false
