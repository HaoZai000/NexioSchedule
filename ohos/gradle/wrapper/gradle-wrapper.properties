# 1.2.0 批次只支持 Gradle 8.x（Gradle 9 解析不了该线的 Kotlin 插件）。
# 因此本构建必须用 JDK 21：JAVA_HOME=~/jdk21/jdk-21.0.2.jdk/Contents/Home
# 主构建（Android/iOS/桌面）仍用 JDK 25 + Gradle 9.5.1，两者互不影响。
distributionUrl=https://mirrors.cloud.tencent.com/gradle/gradle-8.14.1-bin.zip
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
networkTimeout=10000
validateDistributionUrl=true
