# 鸿蒙构建（CMP 1.9.2-1.2.0 批次）的属性。

# 渲染后端：**skia**。
#
# 默认的 `fusion-renderer` 是把 Compose 翻译成 ArkUI 节点的另一条管线，不是同一套实现：
# 实测点按事件进不去（只有滑动生效）、滑两下后整个 UI 卡死、且玻璃/模糊/着色器全部拿不到
# 渲染桥（`asComposeShader` 等）。那不是「鸿蒙端该有的差异」，是换了个渲染器。
#
# skia 后端跑的是和 Android/iOS/桌面同一套 Compose 渲染器（同一份 Skia），
# 所以 UI 代码不需要任何平台分支 —— 只需要平台调用在鸿蒙上可用（由 :sharedBackdrop /
# :sharedMiuix 的 ohos 变体提供）。
rendererBackend=skia


# Kotlin/Native 编译器内存给足（这棵树要编 core + ui-shared + miuix，klib 不小）
kotlin.native.jvmargs=-Xmx6g
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.caching=true
